name: Deploy

# Every push to main ships. The build happens here rather than on the server:
# the host's process limits stop Vite's bundler from starting, so the compiled
# assets are produced in CI and committed back before the server pulls.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # The suite needs a real MySQL: pdo_sqlite is not installed on this
    # project's machines, so the tests are written against MySQL rather than
    # the Laravel default of an in-memory SQLite file.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: puurquery_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_mysql, intl, zip, mbstring

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # The server cannot build, so it needs the compiled output in git. If
      # the build produced something different from what was committed, push
      # the difference back before deploying.
      - name: Commit refreshed build output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/build; then
            git add public/build
            git commit -m "Rebuild assets [skip ci]"
            git push
          else
            echo "build output already up to date"
          fi

      # Nothing ships that does not pass. Before this, a broken commit would
      # have been published and only noticed on the live site.
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan key:generate --env=testing || true
          php artisan test

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: bash ~/deploy-purrquery.sh

      - name: Verify the site is up
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 https://purrquery.com/)
          echo "https://purrquery.com/ -> $code"
          [ "$code" = "200" ]
